# Store diff (docs/security.md, "Trust in the verifier"; docs/release.md). Compares the package
# addons.mozilla.org serves with the attested release zip, daily. Disabled until the AMO listing
# exists (`vars.AMO_LISTED == 'true'`). Pinned code of this repository only; it reads nothing but the
# AMO API, the GitHub release and the repository's refs, and keeps no state.
#
# - The AMO file is checked against the sha256 AMO lists for it.
# - The release tag's commit must be on refs/heads/main, and the release zip's build provenance must
#   come from release-extension.yml at that tag and commit (`gh attestation verify`).
# - tools/verify-store-package.ts then compares the AMO package with the attested zip (the files
#   AMO adds when it signs the package are the only accepted difference; manifest.json, which AMO
#   re-encodes, must hold the same JSON).
name: store-diff

on:
  schedule:
    - cron: '23 5 * * *'
  workflow_dispatch:

permissions: {}

defaults:
  run:
    shell: bash

env:
  REPO: phawrylak/IntactWarden

jobs:
  store-diff:
    if: >-
      vars.AMO_LISTED == 'true' &&
      github.repository == 'phawrylak/IntactWarden' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: store-diff
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - name: Check out the pinned code (tools/verify-store-package.ts)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false
      - name: Install dependencies (no lifecycle scripts)
        run: npm ci --ignore-scripts
      - name: Download the AMO package and the attested release zip
        id: download
        env:
          GH_TOKEN: ${{ github.token }}
          AMO_GUID: intactwarden@phawrylak
        run: |
          work="$RUNNER_TEMP/store"
          mkdir -p "$work/release"
          curl --fail --silent --show-error --proto '=https' --max-filesize 1048576 \
            --output "$work/addon.json" \
            "https://addons.mozilla.org/api/v5/addons/addon/$AMO_GUID/"
          version="$(jq -r '.current_version.version' "$work/addon.json")"
          url="$(jq -r '.current_version.file.url' "$work/addon.json")"
          hash="$(jq -r '.current_version.file.hash' "$work/addon.json")"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo '::error::AMO lists no current version in the expected form'
            exit 1
          fi
          if ! [[ "$url" =~ ^https://addons\.mozilla\.org/[A-Za-z0-9._/%@+-]+\.xpi$ ]]; then
            echo '::error::AMO lists an unexpected file URL'
            exit 1
          fi
          if ! [[ "$hash" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo '::error::AMO lists no sha256 file hash'
            exit 1
          fi
          curl --fail --silent --show-error --location --proto '=https' --max-filesize 52428800 \
            --output "$work/store.xpi" "$url"
          echo "${hash#sha256:}  $work/store.xpi" | sha256sum --check --strict
          gh release download "v$version" --repo "$REPO" --dir "$work/release" \
            --pattern "intactwarden-$version-firefox.zip" \
            --pattern "intactwarden-$version-provenance.sigstore.json" \
            --pattern SHA256SUMS
          # The release tag's commit, which must be on refs/heads/main: the provenance is then pinned
          # to it, so a release built by a tag on unreviewed code fails here.
          tag_object="$(gh api "repos/$REPO/git/ref/tags/v$version" --jq '.object.sha')"
          commit="$(gh api "repos/$REPO/git/tags/$tag_object" --jq '.object.sha')"
          main_sha="$(gh api "repos/$REPO/git/ref/heads/main" --jq '.object.sha')"
          if ! [[ "$commit" =~ ^[0-9a-f]{40}$ ]] || ! [[ "$main_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo '::error::cannot resolve the release tag or refs/heads/main'
            exit 1
          fi
          on_main="$(gh api "repos/$REPO/compare/$main_sha...$commit?per_page=1" \
            --jq '"\(.status) \(.ahead_by)"')"
          if [ "$on_main" != 'identical 0' ] && [ "$on_main" != 'behind 0' ]; then
            echo "::error::the commit of tag v$version is not on main"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
      - name: Verify the provenance of the release zip
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.download.outputs.version }}
          COMMIT: ${{ steps.download.outputs.commit }}
        run: |
          release="$RUNNER_TEMP/store/release"
          gh attestation verify "$release/intactwarden-$VERSION-firefox.zip" \
            --repo "$REPO" \
            --bundle "$release/intactwarden-$VERSION-provenance.sigstore.json" \
            --signer-workflow "$REPO/.github/workflows/release-extension.yml" \
            --source-ref "refs/tags/v$VERSION" \
            --source-digest "$COMMIT"
      - name: Compare the AMO package with the attested zip
        env:
          VERSION: ${{ steps.download.outputs.version }}
        run: |
          work="$RUNNER_TEMP/store"
          node tools/verify-store-package.ts \
            --expected "$work/release/intactwarden-$VERSION-firefox.zip" \
            --package "$work/store.xpi" \
            --sha256sums "$work/release/SHA256SUMS"
